name: CI & Security Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Python SAST (Bandit)
        run: |
          pip install bandit
          bandit -r services/ packages/ -ll -ii || echo "Warning only for now"

  schema-validation:
    name: Contract Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON Schemas exist and are parseable
        run: |
          python -m json.tool packages/contracts/evidence.schema.json > /dev/null
          python -m json.tool packages/contracts/llm-interpretation.schema.json > /dev/null

  unit-tests:
    name: Regression Unit Tests (B1-B9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Test Suite
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/unit/ -v
